<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RTTY Encode / Decode — Landscape</title>
<style>
  :root {
    --bg: #12151a;
    --panel: #1a1f24;
    --panel-2: #20272c;
    --line: #2c3538;
    --text: #e7e4da;
    --dim: #8a9296;
    --mark: #e8a33d;
    --space: #3ddbd9;
    --mark-dark: #8a641f;
    --space-dark: #1c8f8d;
    --params: #b892e8;
    --ok: #59d97c;
    --bad: #e35b5b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; background:var(--bg); height:100%;
    overflow:hidden; /* whole app fits one screen, no page scroll */
  }
  body {
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    font-size: 12px;
  }

  .page {
    display:grid;
    /* narrow fixed-width middle column (single-column params) lets encode/decode share the rest equally */
    grid-template-columns: 1fr 130px 1fr;
    gap:8px;
    height:100vh;
    padding:6px;
  }
  .col {
    display:flex;
    flex-direction:column;
    min-height:0;
    min-width:0;
    overflow:hidden;
  }

  header.section-head { margin-bottom:6px; flex:0 0 auto; }
  .eyebrow { font-size:9px; letter-spacing:.06em; color:var(--dim); margin:0; text-transform:uppercase; }
  h1 { margin:0; font-size:16px; font-weight:700; letter-spacing:-0.01em; line-height:1.1; }
  h1 span.accent-tx { color:var(--mark); }
  h1 span.accent-rx { color:var(--space); }
  h1 span.accent-params { color:var(--params); }

  .panel {
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px;
    margin-bottom:6px;
    flex:0 0 auto;
  }
  /* .grow panels stretch to consume all leftover column height, so encode's
     Message field and decode's Decoded Text field end up exactly the same
     height as each other (both columns are the same total height). */
  .panel.grow { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; margin-bottom:0; }
  .panel h2 {
    font-size:9px;
    font-weight:700;
    color:var(--dim);
    margin:0 0 6px;
    letter-spacing:.04em;
    text-transform:uppercase;
  }

  label { display:block; font-size:9px; color:var(--dim); margin-bottom:2px; }
  select, input[type=number], input[type=text], textarea {
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:5px 6px;
    border-radius:5px;
    font-size:12px;
    font-family:inherit;
  }
  textarea { resize:none; font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; font-size:11px; }
  /* Message textarea expands to fill its .panel.grow wrapper */
  #genMsg { flex:1 1 auto; min-height:0; height:auto; }
  select:focus, input:focus, textarea:focus { outline:2px solid var(--params); outline-offset:1px; }
  .field { margin-bottom:6px; }

  /* Signal Parameters: single column stack (narrows the middle column) */
  .stack { display:flex; flex-direction:column; }
  .row { display:flex; gap:6px; }
  .row > div { flex:1; }
  .row + .row { margin-top:6px; }

  .checks { display:flex; flex-direction:column; gap:4px; margin-top:6px; }
  .check { display:flex; align-items:center; gap:5px; font-size:10px; color:var(--dim); }
  .check input { width:13px; height:13px; flex:0 0 auto; }

  button {
    font-size:11px;
    font-weight:600;
    padding:6px 8px;
    border-radius:5px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    cursor:pointer;
    font-family:inherit;
  }
  button.primary-tx { background:var(--mark); border-color:var(--mark); color:#1a1200; }
  button.primary-tx:disabled { background:var(--panel-2); border-color:var(--line); color:var(--dim); }
  button.primary-rx { background:var(--space); border-color:var(--space); color:#062626; }
  button.primary-rx.stop { background:var(--bad); border-color:var(--bad); color:#2a0a0a; }
  button:disabled { opacity:.45; cursor:default; }
  button:active:not(:disabled) { transform:translateY(1px); }
  .btnrow { display:flex; gap:6px; margin-top:6px; flex-wrap:nowrap; }
  .btnrow > button { flex:1; min-width:0; }

  .presets { display:flex; gap:4px; margin-top:6px; flex-wrap:wrap; }
  .presets button { flex:none; font-size:9px; padding:4px 5px; background:transparent; color:var(--dim); }

  .filebtn { position:relative; overflow:hidden; display:inline-block; flex:1; min-width:0; }
  .filebtn input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; }

  progress { width:100%; height:4px; margin-top:6px; accent-color:var(--space); display:none; }

  .status, .stat { font-size:9px; color:var(--dim); margin-top:6px; min-height:11px; flex:0 0 auto; }

  /* Symmetrical indicator row: LEDs (encode) mirror MRK/SPC meters (decode).
     Both sit in the first, fixed-height panel of their column so they land
     at the same vertical position. */
  .indicator-row { display:flex; align-items:flex-end; gap:8px; }
  .indicator-fixed { flex:0 0 auto; }

  .scope { display:flex; align-items:flex-end; gap:6px; height:36px; }
  .bar-col { flex:1; display:flex; flex-direction:column-reverse; align-items:center; gap:3px; height:100%; }
  .bar-track {
    width:100%; max-width:44px; height:100%; background:var(--panel-2);
    border:1px solid var(--line); border-radius:4px; display:flex; align-items:flex-end; overflow:hidden;
  }
  .bar-fill { width:100%; height:2%; transition:height .06s linear; }
  .bar-fill.mark { background:linear-gradient(var(--mark), var(--mark-dark)); }
  .bar-fill.space { background:linear-gradient(var(--space), var(--space-dark)); }
  .bar-label { font-size:8px; color:var(--dim); letter-spacing:.04em; }

  .led-block { display:flex; flex-direction:column; justify-content:flex-end; gap:8px; height:36px; }
  .led-row { display:flex; align-items:center; gap:5px; }
  .led { width:8px; height:8px; border-radius:50%; background:var(--line); transition:background .05s; flex:0 0 auto; }
  .led.mark { background:var(--mark); box-shadow:0 0 5px var(--mark); }
  .led.space { background:var(--space); box-shadow:0 0 5px var(--space); }
  .led-label { font-size:9px; color:var(--dim); }

  .lock-dot { width:7px; height:7px; border-radius:50%; background:var(--line); display:inline-block; margin-right:5px; transition:background .15s; flex:0 0 auto; }
  .lock-dot.on { background:var(--ok); box-shadow:0 0 5px var(--ok); }
  .lock-row { display:flex; align-items:center; font-size:9px; color:var(--dim); }

  .paper {
    background:#0d1013;
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px;
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size:11px;
    line-height:1.4;
    white-space:pre-wrap;
    word-break:break-word;
    color:#d7f5df;
  }
  .paper:empty::before { content:"— idle —"; color:var(--dim); }
  .outrow { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex:0 0 auto; }
  .smallbtn { font-size:9px; padding:4px 6px; font-weight:500; }

  /* Params column framed distinctly since it's shared */
  #paramsCol .panel { border-color: var(--params); }
</style>
</head>
<body>
<div class="page">

<!-- ============================================================ -->
<!-- ENCODE (left) -->
<!-- Panel 1 (fixed): LEDs + TX controls — mirrors Decode panel 1 (meters + RX controls)
     Panel 2 (grow):  Message textarea — mirrors Decode panel 2 (Decoded Text) -->
<!-- ============================================================ -->
<section class="col" id="genSection">

  <header class="section-head">
    <p class="eyebrow">TX TERMINAL</p>
    <h1>RTTY <span class="accent-tx">Encode</span></h1>
  </header>

  <div class="panel">
    <div class="indicator-row">
      <div class="indicator-fixed">
        <div class="led-block">
          <div class="led-row"><div class="led" id="genLedMark"></div><span class="led-label">MARK</span></div>
          <div class="led-row"><div class="led" id="genLedSpace"></div><span class="led-label">SPACE</span></div>
        </div>
      </div>
      <div style="flex:1;">
        <div class="btnrow" style="margin-top:0;">
          <button class="primary-tx" id="genPlayBtn">▶ Play</button>
          <button id="genStopBtn" disabled>■ Stop</button>
        </div>
        <div class="btnrow">
          <button id="genDownloadBtn">⬇ Download WAV</button>
        </div>
        <div class="status" id="genStatus">Ready.</div>
      </div>
    </div>
  </div>

  <div class="panel grow">
    <h2>Message</h2>
    <textarea id="genMsg">CQ CQ CQ DE M0ABC M0ABC K</textarea>
  </div>

</section>

<!-- ============================================================ -->
<!-- SIGNAL PARAMETERS (middle — shared by encode + decode, single column) -->
<!-- ============================================================ -->
<section class="col" id="paramsCol">

  <header class="section-head">
    <p class="eyebrow">SHARED TX/RX</p>
    <h1><span class="accent-params">Signal</span></h1>
  </header>

  <div class="panel">
    <div class="stack">
      <div class="field">
        <label for="sigMark">Mark (Hz)</label>
        <input type="number" id="sigMark" value="2125" step="1">
      </div>
      <div class="field">
        <label for="sigShift">Shift (Hz)</label>
        <input type="number" id="sigShift" value="170" step="1">
      </div>
      <div class="field">
        <label for="sigBaud">Baud</label>
        <input type="number" id="sigBaud" value="45.45" step="0.01">
      </div>
      <div class="field">
        <label for="sigStopbits">Stop bits</label>
        <input type="number" id="sigStopbits" value="1.5" step="0.5">
      </div>
    </div>
    <div class="checks">
      <label class="check"><input type="checkbox" id="sigReverse"> Reverse mark/space</label>
      <label class="check"><input type="checkbox" id="sigUsos" checked> USOS (decode)</label>
    </div>
    <div class="presets">
      <button data-baud="45.45" data-shift="170">45.45/170</button>
      <button data-baud="50" data-shift="450">50/450</button>
      <button data-baud="75" data-shift="170">75/170</button>
    </div>
  </div>

</section>

<!-- ============================================================ -->
<!-- DECODE (right) -->
<!-- Panel 1 (fixed): MRK/SPC meters + RX controls — mirrors Encode panel 1
     Panel 2 (grow):  Decoded Text — mirrors Encode panel 2 (Message) -->
<!-- ============================================================ -->
<section class="col" id="decSection">

  <header class="section-head">
    <p class="eyebrow">RX TERMINAL</p>
    <h1>RTTY <span class="accent-rx">Decode</span></h1>
  </header>

  <div class="panel">
    <div class="indicator-row">
      <div class="indicator-fixed">
        <div class="scope">
          <div class="bar-col">
            <div class="bar-track"><div class="bar-fill mark" id="markBar"></div></div>
            <div class="bar-label">MRK</div>
          </div>
          <div class="bar-col">
            <div class="bar-track"><div class="bar-fill space" id="spaceBar"></div></div>
            <div class="bar-label">SPC</div>
          </div>
        </div>
      </div>
      <div style="flex:1;">
        <div class="lock-row"><span class="lock-dot" id="lockDot"></span><span id="lockText">no signal</span></div>
        <div class="btnrow">
          <button class="primary-rx" id="micBtn">Start mic</button>
          <button class="filebtn" id="fileBtnWrap">File
            <input type="file" id="fileInput" accept="audio/*,.wav,.mp3,.m4a,.ogg,.flac">
          </button>
        </div>
        <progress id="fileProgress" value="0" max="100"></progress>
        <div class="stat" id="fileStatus"></div>
      </div>
    </div>
  </div>

  <div class="panel grow">
    <div class="outrow">
      <h2 style="margin:0;">Decoded Text</h2>
      <div>
        <button class="smallbtn" id="copyBtn">Copy</button>
        <button class="smallbtn" id="clearBtn">Clear</button>
      </div>
    </div>
    <div class="paper" id="output"></div>
    <div class="stat" id="charStat"></div>
  </div>

</section>

</div>

<script>
(function(){
"use strict";

const ITA2 = [
  {code:"00000", letter:null,  figure:null},
  {code:"00001", letter:"E",   figure:"3"},
  {code:"00010", letter:"\n",  figure:"\n"},
  {code:"00011", letter:"A",   figure:"-"},
  {code:"00100", letter:" ",   figure:" "},
  {code:"00101", letter:"S",   figure:"\x07"},
  {code:"00110", letter:"I",   figure:"8"},
  {code:"00111", letter:"U",   figure:"7"},
  {code:"01000", letter:"\r",  figure:"\r"},
  {code:"01001", letter:"D",   figure:"$"},
  {code:"01010", letter:"R",   figure:"4"},
  {code:"01011", letter:"J",   figure:"'"},
  {code:"01100", letter:"N",   figure:","},
  {code:"01101", letter:"F",   figure:"!"},
  {code:"01110", letter:"C",   figure:":"},
  {code:"01111", letter:"K",   figure:"("},
  {code:"10000", letter:"T",   figure:"5"},
  {code:"10001", letter:"Z",   figure:"\""},
  {code:"10010", letter:"L",   figure:")"},
  {code:"10011", letter:"W",   figure:"2"},
  {code:"10100", letter:"H",   figure:"#"},
  {code:"10101", letter:"Y",   figure:"6"},
  {code:"10110", letter:"P",   figure:"0"},
  {code:"10111", letter:"Q",   figure:"1"},
  {code:"11000", letter:"O",   figure:"9"},
  {code:"11001", letter:"B",   figure:"?"},
  {code:"11010", letter:"G",   figure:"&"},
  {code:"11011", letter:null,  figure:null},
  {code:"11100", letter:"M",   figure:"."},
  {code:"11101", letter:"X",   figure:"/"},
  {code:"11110", letter:"V",   figure:";"},
  {code:"11111", letter:null,  figure:null},
];
const FIGS_CODE = "11011";
const LTRS_CODE = "11111";

const letterMap = {};
const figureMap = {};
for (const e of ITA2) {
  if (e.letter && e.letter !== " " && e.letter !== "\n" && e.letter !== "\r") letterMap[e.letter] = e.code;
  if (e.figure && e.figure !== " " && e.figure !== "\n" && e.figure !== "\r") figureMap[e.figure] = e.code;
}
letterMap[" "] = "00100"; figureMap[" "] = "00100";
letterMap["\n"] = "00010"; figureMap["\n"] = "00010";
letterMap["\r"] = "01000"; figureMap["\r"] = "01000";

function encodeText(text) {
  const codes = [];
  let shift = "LTRS";
  const upper = text.toUpperCase();
  for (const ch of upper) {
    let target = null, code = null;
    if (letterMap.hasOwnProperty(ch) && (ch === " " || ch === "\n" || ch === "\r" || /[A-Z]/.test(ch))) {
      target = "LTRS"; code = letterMap[ch];
    } else if (figureMap.hasOwnProperty(ch)) {
      target = "FIGS"; code = figureMap[ch];
    } else {
      continue;
    }
    if (target !== shift && ch !== " " && ch !== "\n" && ch !== "\r") {
      codes.push(target === "FIGS" ? FIGS_CODE : LTRS_CODE);
      shift = target;
    }
    codes.push(code);
  }
  return [LTRS_CODE, LTRS_CODE].concat(codes);
}

function buildBitstream(text, baud, stopBits) {
  const codes = encodeText(text);
  const bitDur = 1 / baud;
  const stream = [];
  for (const code of codes) {
    stream.push({bit: 0, dur: bitDur});
    const reversedCode = code.split('').reverse().join('');
    for (const c of reversedCode) {
      stream.push({bit: c === "1" ? 1 : 0, dur: bitDur});
    }
    stream.push({bit: 1, dur: bitDur * stopBits});
  }
  return stream;
}

// Shared signal-parameters getter (used by both encode + decode scripts)
function getSettings() {
  const baud = parseFloat(document.getElementById('sigBaud').value) || 45.45;
  const shift = parseFloat(document.getElementById('sigShift').value) || 170;
  const mark = parseFloat(document.getElementById('sigMark').value) || 2125;
  const stopBits = parseFloat(document.getElementById('sigStopbits').value) || 1.5;
  const reverse = document.getElementById('sigReverse').checked;
  const space = reverse ? mark + shift : mark - shift;
  return {baud, shift, markFreq: mark, spaceFreq: space, stopBits, reverse};
}
window.__rttyGetSettings = getSettings;

let audioCtx = null, osc = null, gainNode = null, playTimer = null, playing = false;

function playRTTY() {
  const text = document.getElementById('genMsg').value;
  if (!text.trim()) { setStatus("Nothing to send."); return; }
  const {baud, markFreq, spaceFreq, stopBits} = getSettings();
  const stream = buildBitstream(text, baud, stopBits);

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  osc = audioCtx.createOscillator();
  gainNode = audioCtx.createGain();
  osc.type = 'sine';
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  const now = audioCtx.currentTime + 0.05;
  gainNode.gain.setValueAtTime(0, now);
  gainNode.gain.linearRampToValueAtTime(0.8, now + 0.01);

  let t = now;
  osc.frequency.setValueAtTime(stream[0].bit ? markFreq : spaceFreq, t);
  for (const b of stream) {
    osc.frequency.setValueAtTime(b.bit ? markFreq : spaceFreq, t);
    t += b.dur;
  }
  gainNode.gain.setValueAtTime(0.8, t);
  gainNode.gain.linearRampToValueAtTime(0, t + 0.02);

  osc.start(now);
  osc.stop(t + 0.05);

  playing = true;
  document.getElementById('genPlayBtn').disabled = true;
  document.getElementById('genStopBtn').disabled = false;
  setStatus(`Sending… (${stream.length} bits, ~${(t - now).toFixed(1)}s)`);

  let idx = 0, elapsed = 0;
  const startWall = performance.now();
  function tick() {
    if (!playing) return;
    const nowSec = (performance.now() - startWall) / 1000;
    while (idx < stream.length && elapsed + stream[idx].dur < nowSec) {
      elapsed += stream[idx].dur;
      idx++;
    }
    if (idx < stream.length) {
      setLED(stream[idx].bit === 1);
      playTimer = requestAnimationFrame(tick);
    } else {
      stopRTTY();
      setStatus("Done.");
    }
  }
  playTimer = requestAnimationFrame(tick);

  osc.onended = () => {
    if (playing) stopRTTY();
  };
}

function setLED(mark) {
  document.getElementById('genLedMark').className = 'led' + (mark ? ' mark' : '');
  document.getElementById('genLedSpace').className = 'led' + (!mark ? ' space' : '');
}

function stopRTTY() {
  playing = false;
  if (playTimer) cancelAnimationFrame(playTimer);
  if (osc) { try { osc.stop(); } catch(e) {} }
  if (audioCtx) { audioCtx.close(); }
  document.getElementById('genPlayBtn').disabled = false;
  document.getElementById('genStopBtn').disabled = true;
  setLED(null);
  document.getElementById('genLedMark').className = 'led';
  document.getElementById('genLedSpace').className = 'led';
}

function setStatus(s) {
  document.getElementById('genStatus').textContent = s;
}

function renderToWavBlob() {
  const text = document.getElementById('genMsg').value;
  const {baud, markFreq, spaceFreq, stopBits} = getSettings();
  const stream = buildBitstream(text, baud, stopBits);
  const sampleRate = 44100;
  const totalDur = stream.reduce((a, b) => a + b.dur, 0) + 0.1;
  const numSamples = Math.ceil(totalDur * sampleRate);
  const data = new Float32Array(numSamples);

  let sampleIdx = 0;
  let phase = 0;
  for (const b of stream) {
    const freq = b.bit ? markFreq : spaceFreq;
    const nSamp = Math.round(b.dur * sampleRate);
    for (let i = 0; i < nSamp && sampleIdx < numSamples; i++, sampleIdx++) {
      data[sampleIdx] = Math.sin(phase) * 0.8;
      phase += 2 * Math.PI * freq / sampleRate;
      if (phase > 2 * Math.PI * 1000) phase -= 2 * Math.PI * 1000;
    }
  }
  const fadeSamples = Math.floor(0.005 * sampleRate);
  for (let i = 0; i < fadeSamples && i < data.length; i++) {
    data[i] *= i / fadeSamples;
    data[data.length - 1 - i] *= i / fadeSamples;
  }

  const buffer = new ArrayBuffer(44 + data.length * 2);
  const view = new DataView(buffer);
  function writeStr(offset, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + data.length * 2, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, 'data');
  view.setUint32(40, data.length * 2, true);
  let offset = 44;
  for (let i = 0; i < data.length; i++, offset += 2) {
    const s = Math.max(-1, Math.min(1, data[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([buffer], {type: 'audio/wav'});
}

document.getElementById('genPlayBtn').addEventListener('click', playRTTY);
document.getElementById('genStopBtn').addEventListener('click', () => { stopRTTY(); setStatus("Stopped."); });
document.getElementById('genDownloadBtn').addEventListener('click', () => {
  setStatus("Rendering WAV…");
  setTimeout(() => {
    const blob = renderToWavBlob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'rtty.wav';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setStatus("WAV downloaded.");
  }, 10);
});

document.querySelectorAll('#paramsSection .presets button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('sigBaud').value = btn.dataset.baud;
    document.getElementById('sigShift').value = btn.dataset.shift;
    setStatus(`Preset applied: ${btn.textContent}`);
  });
});

})();
</script>

<script>
(function(){
  "use strict";

  const LTRS = ['\0','E','\n','A',' ','S','I','U','\r','D','R','J','N','F','C','K',
                'T','Z','L','W','H','Y','P','Q','O','B','G','','M','X','V',''];
  const FIGS = ['\0','3','\n','-',' ','\x07','8','7','\r','$','4',"'",',','!',':','(',
                '5','"',')','2','#','6','0','1','9','?','&','','.','/',';',''];
  const FIGS_CODE = 27, LTRS_CODE = 31;

  function goertzelMag(samples, offset, N, sampleRate, freq){
    const k = Math.round(N * freq / sampleRate);
    const w = (2 * Math.PI / N) * k;
    const cosine = Math.cos(w), sine = Math.sin(w), coeff = 2 * cosine;
    let q0 = 0, q1 = 0, q2 = 0;
    for (let i = 0; i < N; i++){
      q0 = coeff * q1 - q2 + samples[offset + i];
      q2 = q1; q1 = q0;
    }
    const real = q1 - q2 * cosine;
    const imag = q2 * sine;
    return Math.sqrt(real * real + imag * imag);
  }

  class RttyDecoder{
    constructor(opts){
      this.sampleRate = opts.sampleRate;
      this.markFreq   = opts.markFreq;
      this.spaceFreq  = opts.spaceFreq;
      this.baud       = opts.baud;
      this.reverse    = !!opts.reverse;
      this.usos       = !!opts.usos;
      this.onChar     = opts.onChar || function(){};
      this.onLevels   = opts.onLevels || function(){};

      const samplesPerBit = this.sampleRate / this.baud;
      this.windowSize = Math.min(4096, Math.max(64, Math.round(samplesPerBit / 2)));
      this.hop        = Math.min(1024, Math.max(8, Math.round(samplesPerBit / 8)));
      this.decisionsPerBit = samplesPerBit / this.hop;
      this.checkpoints = [1.5,2.5,3.5,4.5,5.5,6.5].map(x => Math.round(x * this.decisionsPerBit));

      this.state = 'IDLE';
      this.prevDecision = 1;
      this.bitCounter = 0;
      this.checkpointIdx = 0;
      this.sampledBits = [];
      this.charState = 'LTRS';

      this.pending = [];
      this.consumed = 0;
    }

    _pushDecision(d){
      if (this.state === 'IDLE'){
        if (this.prevDecision === 1 && d === 0){
          this.state = 'FRAMING';
          this.bitCounter = 0;
          this.checkpointIdx = 0;
          this.sampledBits = [];
        }
      } else {
        this.bitCounter++;
        if (this.checkpointIdx < 6 && this.bitCounter >= this.checkpoints[this.checkpointIdx]){
          if (this.checkpointIdx < 5){
            this.sampledBits.push(d);
          } else {
            this._finalizeChar(d === 1);
            this.state = 'IDLE';
          }
          this.checkpointIdx++;
        }
      }
      this.prevDecision = d;
    }

    _finalizeChar(stopOK){
      if (!stopOK) return;
      let val = 0;
      for (let i = 0; i < 5; i++) if (this.sampledBits[i]) val |= (1 << i);
      if (val === FIGS_CODE){ this.charState = 'FIGS'; return; }
      if (val === LTRS_CODE){ this.charState = 'LTRS'; return; }
      const table = this.charState === 'FIGS' ? FIGS : LTRS;
      const ch = table[val];
      if (!ch || ch === '\0') return;
      if (this.usos && ch === ' ') this.charState = 'LTRS';
      this.onChar(ch);
    }

    _evalWindow(samples, offset){
      const magMark  = goertzelMag(samples, offset, this.windowSize, this.sampleRate, this.markFreq);
      const magSpace = goertzelMag(samples, offset, this.windowSize, this.sampleRate, this.spaceFreq);
      this.onLevels(magMark, magSpace);
      const hi = this.reverse ? magSpace : magMark;
      const lo = this.reverse ? magMark  : magSpace;
      this._pushDecision(hi > lo ? 1 : 0);
    }

    feed(float32){
      for (let i = 0; i < float32.length; i++) this.pending.push(float32[i]);
      while (this.pending.length - this.consumed >= this.windowSize){
        this._evalWindow(this.pending, this.consumed);
        this.consumed += this.hop;
      }
      if (this.consumed > 8192){
        this.pending = this.pending.slice(this.consumed);
        this.consumed = 0;
      }
    }

    async decodeBuffer(float32, onProgress){
      let offset = 0;
      let iter = 0;
      const total = float32.length;
      while (offset + this.windowSize <= total){
        this._evalWindow(float32, offset);
        offset += this.hop;
        iter++;
        if (iter % 4000 === 0){
          if (onProgress) onProgress(offset / total);
          await new Promise(r => setTimeout(r, 0));
        }
      }
      if (onProgress) onProgress(1);
    }
  }

  const $ = id => document.getElementById(id);
  const outEl = $('output');
  const markBar = $('markBar'), spaceBar = $('spaceBar');
  const lockDot = $('lockDot'), lockText = $('lockText');
  const charStat = $('charStat');

  let charCount = 0;
  function appendChar(ch){
    if (ch === '\r') return;
    outEl.textContent += ch;
    charCount++;
    charStat.textContent = charCount + ' characters decoded';
    outEl.scrollTop = outEl.scrollHeight;
  }

  let lastLevelTime = 0;
  function showLevels(magMark, magSpace){
    const now = performance.now();
    if (now - lastLevelTime < 40) return;
    lastLevelTime = now;
    const peak = Math.max(magMark, magSpace, 1);
    markBar.style.height  = Math.min(100, (magMark  / peak) * 100) + '%';
    spaceBar.style.height = Math.min(100, (magSpace / peak) * 100) + '%';
    const ratio = Math.max(magMark, magSpace) / (Math.min(magMark, magSpace) + 1e-6);
    const locked = ratio > 1.6 && peak > 5;
    lockDot.classList.toggle('on', locked);
    lockText.textContent = locked ? 'tone detected' : 'no signal';
  }

  // Reads the shared Signal Parameters panel (mark/shift/baud/stopbits/reverse/usos)
  function readParams(sampleRate){
    const mark  = parseFloat($('sigMark').value) || 2125;
    const shift = parseFloat($('sigShift').value) || 170;
    const reverse = $('sigReverse').checked;
    const space = reverse ? mark + shift : mark - shift;
    return {
      sampleRate,
      markFreq: mark,
      spaceFreq: space,
      baud: parseFloat($('sigBaud').value) || 45.45,
      reverse: reverse,
      usos: $('sigUsos').checked
    };
  }

  $('clearBtn').addEventListener('click', () => {
    outEl.textContent = '';
    charCount = 0;
    charStat.textContent = '';
  });

  $('copyBtn').addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText(outEl.textContent);
      const b = $('copyBtn'); const old = b.textContent;
      b.textContent = 'Copied'; setTimeout(() => b.textContent = old, 1200);
    }catch(e){ /* clipboard may be unavailable; ignore */ }
  });

  // ---------- Microphone mode ----------
  // NOTE: getUserMedia normally requires a secure context (https:// or localhost).
  // We deliberately do NOT pre-check window.isSecureContext or pre-disable the
  // button for file:// origins — some mobile browsers (notably iOS Safari opening
  // a local file) will still grant mic permission. We just attempt it directly and
  // report a clear error only if the browser actually refuses.
  let audioCtx = null, micStream = null, micSource = null, micProcessor = null, micDecoder = null;
  const micBtn = $('micBtn');

  async function startMic(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      lockText.textContent = 'no microphone API available (try https:// or localhost)';
      return;
    }
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      micStream = await navigator.mediaDevices.getUserMedia({ audio: {
        echoCancellation:false, noiseSuppression:false, autoGainControl:false
      }});
    }catch(err){
      const name = err && err.name;
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError'){
        lockText.textContent = 'mic blocked — check browser/site permission settings';
      } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError'){
        lockText.textContent = 'no microphone found on this device';
      } else if (name === 'NotReadableError'){
        lockText.textContent = 'microphone is in use by another app';
      } else if (name === 'SecurityError'){
        lockText.textContent = 'blocked by browser security policy (try https:// or localhost)';
      } else {
        lockText.textContent = 'mic error: ' + (name || err);
      }
      return;
    }
    micDecoder = new RttyDecoder(Object.assign(readParams(audioCtx.sampleRate), {
      onChar: appendChar,
      onLevels: showLevels
    }));
    micSource = audioCtx.createMediaStreamSource(micStream);
    const bufSize = 4096;
    micProcessor = audioCtx.createScriptProcessor(bufSize, 1, 1);
    micProcessor.onaudioprocess = (e) => {
      const data = e.inputBuffer.getChannelData(0);
      micDecoder.feed(data);
    };
    const silentGain = audioCtx.createGain();
    silentGain.gain.value = 0;
    micSource.connect(micProcessor);
    micProcessor.connect(silentGain);
    silentGain.connect(audioCtx.destination);

    micBtn.textContent = 'Stop microphone';
    micBtn.classList.add('stop');
    $('fileBtnWrap').style.opacity = '0.5';
    $('fileBtnWrap').style.pointerEvents = 'none';
  }

  function stopMic(){
    if (micProcessor){ micProcessor.disconnect(); micProcessor.onaudioprocess = null; }
    if (micSource) micSource.disconnect();
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    micProcessor = micSource = micStream = micDecoder = null;
    micBtn.textContent = 'Start microphone';
    micBtn.classList.remove('stop');
    lockDot.classList.remove('on');
    lockText.textContent = 'no signal';
    markBar.style.height = '2%'; spaceBar.style.height = '2%';
    $('fileBtnWrap').style.opacity = '1';
    $('fileBtnWrap').style.pointerEvents = 'auto';
  }

  micBtn.addEventListener('click', () => {
    if (micProcessor) stopMic(); else startMic();
  });

  const fileInput = $('fileInput');
  const fileProgress = $('fileProgress');
  const fileStatus = $('fileStatus');

  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (micProcessor) stopMic();

    fileStatus.textContent = 'Reading ' + file.name + '…';
    fileProgress.style.display = 'block';
    fileProgress.value = 0;
    micBtn.disabled = true;

    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const arrayBuffer = await file.arrayBuffer();
      fileStatus.textContent = 'Decoding audio…';
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      const channel = audioBuffer.getChannelData(0);

      const decoder = new RttyDecoder(Object.assign(readParams(audioBuffer.sampleRate), {
        onChar: appendChar,
        onLevels: showLevels
      }));

      fileStatus.textContent = 'Demodulating RTTY…';
      await decoder.decodeBuffer(channel, (p) => {
        fileProgress.value = Math.round(p * 100);
      });

      fileStatus.textContent = 'Done — ' + file.name + ' (' + audioBuffer.duration.toFixed(1) + 's audio)';
    }catch(err){
      fileStatus.textContent = 'Could not decode this file: ' + (err && err.message ? err.message : err);
    }finally{
      fileProgress.style.display = 'none';
      micBtn.disabled = false;
      fileInput.value = '';
    }
  });

})();
</script>
</body>
</html>
